plugins {
    id 'fabric-loom' version '1.19.3'
}

version = "${project.mod_version}${project.jar_suffix}"
group = 'dev.lumen'
base { archivesName = 'lumenhud' }

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcrange', project.mc_range
    filesMatching('fabric.mod.json') { expand 'version': project.version, 'mcrange': project.mc_range }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java { withSourcesJar() }

sourceSets.main.java.srcDir '../common'
// Things that differ between Minecraft versions live in compat/<kind>-<old|new>; gradle.properties picks one per kind.
['matrix', 'items', 'keys', 'input', 'tex', 'skin', 'font'].each { kind ->
    sourceSets.main.java.srcDir "compat/${kind}-${project.property('compat_' + kind)}"
}
